<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงทะเบียนเลือกห้องพักค่าย</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Prompt', 'sans-serif'] },
                    colors: { primary: '#3b82f6', secondary: '#eff6ff' }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background-color: #f4f9ff;
            background-image: radial-gradient(#cbd5e1 1.5px, transparent 1.5px), radial-gradient(#cbd5e1 1.5px, transparent 1.5px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .logo-glow {
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.5));
            border: none;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>
    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ตั้งค่า Supabase API ---
        const SUPABASE_URL = 'https://lwzisdtxhooigcrjmghf.supabase.co/rest/v1';
        const SUPABASE_KEY = 'sb_publishable_l_c8_21B5RiITy1v2WaP1A_cB6zj9A-';
        const headers = {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
        };

        // Helper Function ดึงข้อมูลคอลัมน์แบบยืดหยุ่น
        const getVal = (obj, keys, defaultVal = '') => {
            if (!obj) return defaultVal;
            for (let key of keys) {
                if (obj[key] !== undefined && obj[key] !== null) return obj[key];
            }
            return defaultVal;
        };

        // SVG Icons
        const Icons = {
            X: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            User: () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>,
            Back: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        };

        function App() {
            const [view, setView] = useState('home');
            const [rooms, setRooms] = useState([]);
            const [registrations, setRegistrations] = useState([]);
            const [loading, setLoading] = useState(true);
            const [selectedRoom, setSelectedRoom] = useState(null);
            const [fetchNotice, setFetchNotice] = useState(null);
            
            // Modal States
            const [modalMsg, setModalMsg] = useState('');
            const [deleteData, setDeleteData] = useState(null);
            const [idCardInput, setIdCardInput] = useState('');

            useEffect(() => {
                let link = document.querySelector("link[rel~='icon']");
                if (!link) {
                    link = document.createElement('link');
                    link.rel = 'icon';
                    document.head.appendChild(link);
                }
                link.href = 'https://score.phukhieo.ac.th/helper/img/pklogo.png';

                fetchInitialData();
            }, []);

            const fetchInitialData = async () => {
                setLoading(true);
                setFetchNotice(null);
                try {
                    const [resRoom, resRegis] = await Promise.all([
                        fetch(`${SUPABASE_URL}/room?select=*`, { headers }),
                        fetch(`${SUPABASE_URL}/regis?select=*`, { headers })
                    ]);
                    
                    if (resRoom.ok && resRegis.ok) {
                        const roomData = await resRoom.json();
                        const regisData = await resRegis.json();
                        setRooms(roomData || []);
                        setRegistrations(regisData || []);

                        if (!roomData || roomData.length === 0) {
                            setFetchNotice('ไม่พบข้อมูลในตาราง "room" (ตารางว่างเปล่า หรือ RLS ใน Supabase ปิดกั้นสิทธิ์อ่านข้อมูล)');
                        }
                    } else {
                        const errRoomText = !resRoom.ok ? await resRoom.text() : '';
                        const errRegisText = !resRegis.ok ? await resRegis.text() : '';
                        setFetchNotice(`เกิดข้อผิดพลาดในการเชื่อมต่อ (Status: ${resRoom.status}/${resRegis.status})\n${errRoomText || errRegisText}`);
                    }
                } catch (error) {
                    setFetchNotice(`ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้: ${error.message}`);
                }
                setLoading(false);
            };

            const showAlert = (msg) => { setModalMsg(msg); };
            const closeAlert = () => { setModalMsg(''); };

            // Render หน้าแรก
            const renderHome = () => {
                const teacherRooms = rooms.filter(r => {
                    const target = String(getVal(r, ['สำหรับ', 'Target', 'target'], '')).trim();
                    return target.includes('ครู');
                });

                const studentRooms = rooms.filter(r => {
                    const target = String(getVal(r, ['สำหรับ', 'Target', 'target'], '')).trim();
                    return target.includes('นักเรียน');
                });

                const otherRooms = rooms.filter(r => !teacherRooms.includes(r) && !studentRooms.includes(r));

                const RoomCard = ({ room }) => {
                    const roomNo = getVal(room, ['ห้องที่', 'room_no', 'id']);
                    const roomName = getVal(room, ['ชื่อห้อง', 'ชื่อห้องพัก', 'room_name']);
                    const gender = getVal(room, ['เพศ', 'gender']);
                    const capacity = Number(getVal(room, ['จำนวนคน/ห้อง', 'จำนวนคน', 'capacity'], 1));

                    const occupants = registrations.filter(reg => String(getVal(reg, ['ห้องที่', 'room_no'])) === String(roomNo));
                    const isFull = occupants.length >= capacity;

                    return (
                        <div className={`glass-panel p-5 rounded-2xl border-2 transition-all ${isFull ? 'border-gray-200 opacity-80' : 'border-blue-100 hover:border-blue-300 hover:shadow-lg cursor-pointer'}`}
                             onClick={() => !isFull && handleSelectRoom(room)}>
                            <div className="flex justify-between items-start mb-3">
                                <div>
                                    <h3 className="text-lg font-bold text-blue-900">ห้องที่ {roomNo}</h3>
                                    <p className="text-sm text-gray-600">{roomName}</p>
                                </div>
                                <div className="text-right">
                                    <span className={`text-xs px-2.5 py-1 rounded-full font-medium ${gender === 'ชาย' ? 'bg-blue-100 text-blue-700' : gender === 'หญิง' ? 'bg-pink-100 text-pink-700' : 'bg-purple-100 text-purple-700'}`}>
                                        เพศ: {gender || 'ไม่ระบุ'}
                                    </span>
                                </div>
                            </div>
                            
                            <div className="mb-4">
                                <p className="text-sm font-medium text-gray-700 mb-2">จำนวนคน: {occupants.length} / {capacity}</p>
                                <div className="w-full bg-gray-200 rounded-full h-2">
                                    <div className={`h-2 rounded-full ${isFull ? 'bg-red-400' : 'bg-green-400'}`} style={{ width: `${capacity > 0 ? Math.min(100, (occupants.length / capacity) * 100) : 0}%` }}></div>
                                </div>
                            </div>

                            <div className="space-y-2 mt-4 pt-4 border-t border-gray-100">
                                {occupants.length > 0 ? occupants.map((occ, idx) => {
                                    const fullName = getVal(occ, ['ชื่อ - สกุล', 'ชื่อ-สกุล', 'fullname', 'name']);
                                    const grade = getVal(occ, ['ระดับชั้น', 'class', 'grade']);
                                    return (
                                        <div key={idx} className="flex justify-between items-center bg-gray-50 p-2.5 rounded-lg text-sm text-gray-700 border border-gray-100" onClick={(e) => e.stopPropagation()}>
                                            <div className="flex items-center gap-2 overflow-hidden">
                                                <Icons.User />
                                                <span className="truncate">{fullName} {grade ? `(${grade})` : ''}</span>
                                            </div>
                                            <button onClick={() => confirmDelete(occ)} title="ลบการลงทะเบียน" className="text-red-400 hover:text-red-600 p-1 rounded-full hover:bg-red-50 transition-colors flex-shrink-0">
                                                <Icons.X />
                                            </button>
                                        </div>
                                    );
                                }) : <p className="text-xs text-gray-400 text-center py-2">ยังไม่มีผู้ลงทะเบียน</p>}
                            </div>
                            
                            {isFull && <div className="mt-3 text-center text-sm text-red-500 font-medium">ห้องนี้เต็มแล้ว</div>}
                        </div>
                    );
                };

                return (
                    <div className="w-full max-w-6xl mx-auto px-4 py-8">
                        {fetchNotice && (
                            <div className="mb-8 p-5 bg-amber-50 border-2 border-amber-200 rounded-2xl text-amber-900 text-sm leading-relaxed shadow-sm">
                                <p className="font-bold text-base mb-1 flex items-center gap-2 text-amber-800">
                                    ⚠️ ไม่พบข้อมูลห้องพักในระบบ
                                </p>
                                <p className="mb-3">{fetchNotice}</p>
                                <div className="bg-white p-3 rounded-xl border border-amber-200 text-xs text-gray-700 space-y-1 mb-3">
                                    <p className="font-bold text-gray-800">วิธีแก้ไขใน Supabase Dashboard:</p>
                                    <p>1. เปิดเมนู <b>Table Editor</b> -&gt; เลือกตาราง <b>room</b>, <b>data</b>, และ <b>regis</b></p>
                                    <p>2. กดปุ่ม <b>+ Add RLS policy</b> ที่มุมขวาบน -&gt; เลือก <b>Create policy from scratch</b></p>
                                    <p>3. ตั้งชื่อ Policy และเลือก <b>Allowed operations: ALL</b> แล้วใส่ค่า <b>USING / WITH CHECK = true</b> เพื่อเปิดสิทธิ์อ่าน/เขียน</p>
                                </div>
                                <button onClick={fetchInitialData} className="px-4 py-2 bg-amber-600 text-white font-medium rounded-xl text-xs hover:bg-amber-700 transition-colors shadow-sm">
                                    🔄 ลองดึงข้อมูลอีกครั้ง
                                </button>
                            </div>
                        )}

                        <h2 className="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2 border-l-4 border-blue-500 pl-3">ห้องพักครู</h2>
                        {teacherRooms.length > 0 ? (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">
                                {teacherRooms.map((room, i) => <RoomCard key={i} room={room} />)}
                            </div>
                        ) : (
                            <p className="text-sm text-gray-400 mb-12 italic pl-4">ไม่มีรายการห้องพักครู</p>
                        )}

                        <h2 className="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2 border-l-4 border-green-500 pl-3">ห้องพักนักเรียน</h2>
                        {studentRooms.length > 0 ? (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">
                                {studentRooms.map((room, i) => <RoomCard key={i} room={room} />)}
                            </div>
                        ) : (
                            <p className="text-sm text-gray-400 mb-12 italic pl-4">ไม่มีรายการห้องพักนักเรียน</p>
                        )}

                        {otherRooms.length > 0 && (
                            <>
                                <h2 className="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2 border-l-4 border-purple-500 pl-3">ห้องพักอื่นๆ</h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {otherRooms.map((room, i) => <RoomCard key={i} room={room} />)}
                                </div>
                            </>
                        )}
                    </div>
                );
            };

            const handleSelectRoom = (room) => {
                setSelectedRoom(room);
                setView('register');
            };

            // Render ฟอร์มลงทะเบียน
            const RegistrationForm = () => {
                const roomNo = getVal(selectedRoom, ['ห้องที่', 'room_no', 'id']);
                const roomName = getVal(selectedRoom, ['ชื่อห้อง', 'ชื่อห้องพัก', 'room_name']);
                const roomTarget = getVal(selectedRoom, ['สำหรับ', 'Target', 'target']);
                const roomGender = getVal(selectedRoom, ['เพศ', 'gender']);
                const capacity = Number(getVal(selectedRoom, ['จำนวนคน/ห้อง', 'จำนวนคน', 'capacity'], 1));

                const occupants = registrations.filter(reg => String(getVal(reg, ['ห้องที่', 'room_no'])) === String(roomNo));
                const availableSlots = Math.max(0, capacity - occupants.length);
                
                const [forms, setForms] = useState(Array.from({length: availableSlots}, () => ({
                    รหัสนักเรียน: '', เลขที่: '', 'ชื่อ - สกุล': '', ระดับชั้น: '', ตำแหน่ง: '',
                    ศาสนา: 'พุทธ', โรคประจำตัว: '', การแพ้อาหาร: '', ยาที่แพ้: '', isVerified: false
                })));
                const [isSubmitting, setIsSubmitting] = useState(false);

                const verifyStudent = async (index, studentId) => {
                    if (!studentId || !studentId.trim()) return;
                    const cleanId = studentId.trim();
                    
                    const duplicatesInForm = forms.filter((f, i) => i !== index && f.รหัสนักเรียน === cleanId);
                    if (duplicatesInForm.length > 0) {
                        showAlert('รหัสนี้ถูกกรอกในฟอร์มนี้แล้ว');
                        return;
                    }

                    if (registrations.some(r => String(getVal(r, ['รหัสนักเรียน', 'student_id'])).trim() === cleanId)) {
                        showAlert('รหัสนี้ได้ทำการลงทะเบียนห้องพักไปแล้ว');
                        return;
                    }

                    try {
                        const res = await fetch(`${SUPABASE_URL}/data?รหัสนักเรียน=eq.${cleanId}`, { headers });
                        
                        if (!res.ok) {
                            const errText = await res.text();
                            showAlert(`เกิดข้อผิดพลาดในการตรวจสอบข้อมูล (${res.status}): ${errText}`);
                            return;
                        }

                        const data = await res.json();

                        if (data && data.length > 0) {
                            const studentData = data[0];
                            const studentGender = getVal(studentData, ['เพศ', 'gender']);
                            const studentPos = getVal(studentData, ['ตำแหน่ง', 'position']);
                            
                            if (roomGender && studentGender && studentGender !== roomGender) {
                                showAlert(`ไม่สามารถลงทะเบียนได้: ห้องนี้สำหรับเพศ ${roomGender} (ข้อมูลผู้สมัครเป็นเพศ ${studentGender})`);
                                return;
                            }
                            if (roomTarget && studentPos && !String(roomTarget).includes(studentPos)) {
                                showAlert(`ไม่สามารถลงทะเบียนได้: ห้องนี้สำหรับ ${roomTarget} (ตำแหน่งของคุณคือ ${studentPos})`);
                                return;
                            }

                            const newForms = [...forms];
                            newForms[index] = {
                                ...newForms[index],
                                รหัสนักเรียน: cleanId,
                                เลขที่: getVal(studentData, ['เลขที่', 'no'], '-'),
                                'ชื่อ - สกุล': getVal(studentData, ['ชื่อ - สกุล', 'ชื่อ-สกุล', 'fullname', 'name']),
                                ระดับชั้น: getVal(studentData, ['ระดับชั้น', 'class', 'grade'], '-'),
                                ตำแหน่ง: studentPos || '-',
                                isVerified: true
                            };
                            setForms(newForms);
                        } else {
                            showAlert('ไม่พบข้อมูลรหัสนี้ในแผ่นงาน "data"');
                            const newForms = [...forms];
                            newForms[index].isVerified = false;
                            newForms[index]['ชื่อ - สกุล'] = '';
                            setForms(newForms);
                        }
                    } catch (err) {
                        showAlert('เกิดข้อผิดพลาดในการตรวจสอบข้อมูล');
                    }
                };

                const handleSubmit = async () => {
                    const validForms = forms.filter(f => f.isVerified);
                    if (validForms.length === 0) {
                        showAlert('กรุณากรอกและตรวจสอบรหัสนักเรียนให้ถูกต้องอย่างน้อย 1 คน');
                        return;
                    }

                    setIsSubmitting(true);
                    
                    const payloads = validForms.map(form => ({
                        'ห้องที่': roomNo,
                        'ชื่อห้องพัก': roomName,
                        'เพศ': roomGender,
                        'รหัสนักเรียน': form['รหัสนักเรียน'],
                        'ชื่อ - สกุล': form['ชื่อ - สกุล'],
                        'ระดับชั้น': form['ระดับชั้น'],
                        'ตำแหน่ง': form['ตำแหน่ง'],
                        'ศาสนา': form['ศาสนา'],
                        'โรคประจำตัว': form['โรคประจำตัว'] || '-',
                        'การแพ้อาหาร': form['การแพ้อาหาร'] || '-',
                        'ยาที่แพ้': form['ยาที่แพ้'] || '-'
                    }));

                    try {
                        const res = await fetch(`${SUPABASE_URL}/regis`, {
                            method: 'POST',
                            headers,
                            body: JSON.stringify(payloads)
                        });

                        if (res.ok) {
                            showAlert('ลงทะเบียนสำเร็จ!');
                            await fetchInitialData();
                            setView('home');
                        } else {
                            const errText = await res.text();
                            showAlert(`เกิดข้อผิดพลาดในการบันทึกข้อมูล (${res.status}): ${errText}`);
                        }
                    } catch (err) {
                        showAlert('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้');
                    }
                    setIsSubmitting(false);
                };

                return (
                    <div className="w-full max-w-4xl mx-auto px-4 py-8">
                        <button onClick={() => setView('home')} className="flex items-center gap-2 text-gray-500 hover:text-blue-600 mb-6 transition-colors">
                            <Icons.Back /> ย้อนกลับ
                        </button>
                        
                        <div className="glass-panel p-6 rounded-2xl border border-blue-100 mb-8">
                            <h2 className="text-2xl font-bold text-blue-900 mb-2">ลงทะเบียน: ห้องที่ {roomNo}</h2>
                            <div className="flex flex-wrap gap-3 text-sm text-gray-700">
                                <span className="bg-white px-3 py-1 rounded-md border">ชื่อห้อง: {roomName}</span>
                                <span className="bg-white px-3 py-1 rounded-md border">สำหรับ: {roomTarget || 'ทั่วไป'}</span>
                                <span className="bg-white px-3 py-1 rounded-md border">เพศ: {roomGender || 'ไม่ระบุ'}</span>
                                <span className="bg-white px-3 py-1 rounded-md border text-blue-600 font-semibold">ที่ว่าง: {availableSlots} ที่</span>
                            </div>
                        </div>

                        {forms.map((form, index) => (
                            <div key={index} className="glass-panel p-6 rounded-2xl border border-gray-200 mb-6 shadow-sm relative overflow-hidden">
                                <div className="absolute top-0 left-0 w-2 h-full bg-blue-500"></div>
                                <h3 className="text-lg font-semibold text-gray-800 mb-4 pl-2">คนที่ {index + 1}</h3>
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">1. รหัสนักเรียน/รหัสครู</label>
                                        <input type="text" 
                                            className="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 outline-none"
                                            value={form['รหัสนักเรียน']}
                                            onChange={e => {
                                                const newForms = [...forms];
                                                newForms[index]['รหัสนักเรียน'] = e.target.value;
                                                newForms[index].isVerified = false;
                                                setForms(newForms);
                                            }}
                                            onBlur={(e) => verifyStudent(index, e.target.value)}
                                            placeholder="พิมพ์รหัส แล้วกดคลิกที่อื่นเพื่อดึงข้อมูล..."
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">2. ชื่อ - สกุล (อัตโนมัติ)</label>
                                        <input type="text" disabled className="w-full p-2.5 bg-gray-100 border border-gray-300 rounded-lg text-gray-600" value={form['ชื่อ - สกุล']} placeholder="ดึงข้อมูลอัตโนมัติ" />
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">3. เลขที่</label>
                                            <input type="text" disabled className="w-full p-2.5 bg-gray-100 border border-gray-300 rounded-lg text-gray-600" value={form['เลขที่']} />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">4. ระดับชั้น</label>
                                            <input type="text" disabled className="w-full p-2.5 bg-gray-100 border border-gray-300 rounded-lg text-gray-600" value={form['ระดับชั้น']} />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">5. ตำแหน่ง</label>
                                            <input type="text" disabled className="w-full p-2.5 bg-gray-100 border border-gray-300 rounded-lg text-gray-600" value={form['ตำแหน่ง']} />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">6. ศาสนา</label>
                                            <select 
                                                className="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 outline-none bg-white"
                                                value={form['ศาสนา']}
                                                onChange={e => {
                                                    const newForms = [...forms];
                                                    newForms[index]['ศาสนา'] = e.target.value;
                                                    setForms(newForms);
                                                }}
                                                disabled={!form.isVerified}
                                            >
                                                <option value="พุทธ">พุทธ</option>
                                                <option value="คริสต์">คริสต์</option>
                                                <option value="อิสลาม">อิสลาม</option>
                                                <option value="เชน">เชน</option>
                                                <option value="อื่น ๆ">อื่น ๆ</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">7. โรคประจำตัว (ถ้ามี)</label>
                                        <input type="text" disabled={!form.isVerified}
                                            className="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 outline-none"
                                            value={form['โรคประจำตัว']}
                                            onChange={e => {
                                                const newForms = [...forms];
                                                newForms[index]['โรคประจำตัว'] = e.target.value;
                                                setForms(newForms);
                                            }}
                                            placeholder="หากไม่มี ใส่ -" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">8. การแพ้อาหาร (ถ้ามี)</label>
                                        <input type="text" disabled={!form.isVerified}
                                            className="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 outline-none"
                                            value={form['การแพ้อาหาร']}
                                            onChange={e => {
                                                const newForms = [...forms];
                                                newForms[index]['การแพ้อาหาร'] = e.target.value;
                                                setForms(newForms);
                                            }}
                                            placeholder="หากไม่มี ใส่ -" />
                                    </div>
                                    <div className="md:col-span-2">
                                        <label className="block text-sm font-medium text-gray-700 mb-1">9. ยาที่แพ้ (ถ้ามี)</label>
                                        <input type="text" disabled={!form.isVerified}
                                            className="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-400 outline-none"
                                            value={form['ยาที่แพ้']}
                                            onChange={e => {
                                                const newForms = [...forms];
                                                newForms[index]['ยาที่แพ้'] = e.target.value;
                                                setForms(newForms);
                                            }}
                                            placeholder="หากไม่มี ใส่ -" />
                                    </div>
                                </div>
                            </div>
                        ))}

                        <div className="flex justify-end gap-4 mt-8 mb-12">
                            <button onClick={() => setView('home')} className="px-6 py-3 rounded-xl border border-gray-300 text-gray-700 hover:bg-gray-50 transition-colors font-medium">
                                ยกเลิก
                            </button>
                            <button 
                                onClick={handleSubmit} 
                                disabled={isSubmitting}
                                className={`px-8 py-3 rounded-xl text-white font-medium shadow-md transition-all ${isSubmitting ? 'bg-blue-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700 hover:shadow-lg'}`}
                            >
                                {isSubmitting ? 'กำลังบันทึก...' : 'บันทึกการลงทะเบียน'}
                            </button>
                        </div>
                    </div>
                );
            };

            // ลบการลงทะเบียน
            const confirmDelete = (personData) => {
                setDeleteData(personData);
                setIdCardInput('');
            };

            const executeDelete = async () => {
                if (!idCardInput.trim()) {
                    showAlert('กรุณากรอกเลขบัตรประจำตัวประชาชน');
                    return;
                }

                setLoading(true);
                try {
                    const studentId = getVal(deleteData, ['รหัสนักเรียน', 'student_id']);
                    
                    const resVerify = await fetch(`${SUPABASE_URL}/data?รหัสนักเรียน=eq.${studentId}`, { headers });
                    
                    if (!resVerify.ok) {
                        const errText = await resVerify.text();
                        showAlert(`เกิดข้อผิดพลาดในการตรวจสอบ (${resVerify.status}): ${errText}`);
                        setLoading(false);
                        return;
                    }

                    const verifyData = await resVerify.json();

                    if (verifyData && verifyData.length > 0) {
                        const dbIdCard = String(getVal(verifyData[0], ['เลขบัตประจำตัว', 'เลขบัตรประจำตัว', 'id_card', 'citizen_id'])).trim();
                        
                        if (dbIdCard === idCardInput.trim()) {
                            const resDelete = await fetch(`${SUPABASE_URL}/regis?รหัสนักเรียน=eq.${studentId}`, {
                                method: 'DELETE',
                                headers
                            });

                            if (resDelete.ok) {
                                showAlert('ลบข้อมูลการลงทะเบียนเรียบร้อยแล้ว');
                                setDeleteData(null);
                                await fetchInitialData();
                            } else {
                                const errText = await resDelete.text();
                                showAlert(`เกิดข้อผิดพลาดในการลบข้อมูล (${resDelete.status}): ${errText}`);
                            }
                        } else {
                            showAlert('เลขบัตรประจำตัวประชาชนไม่ถูกต้อง');
                        }
                    } else {
                        showAlert('ไม่พบข้อมูลรหัสนี้ในแผ่นงาน "data"');
                    }
                } catch (err) {
                    showAlert('เกิดข้อผิดพลาดในการเชื่อมต่อ');
                }
                setLoading(false);
            };

            return (
                <>
                    {/* Header */}
                    <header className="pt-10 pb-6 px-4 text-center">
                        <div className="flex justify-center mb-4">
                            <img src="https://score.phukhieo.ac.th/helper/img/pklogo.png" alt="Logo" className="w-24 h-24 object-contain logo-glow" />
                        </div>
                        <h1 className="text-3xl font-bold text-blue-900 mb-2">ลงทะเบียนเลือกห้องพักค่าย</h1>
                        <p className="text-lg text-gray-700 max-w-2xl mx-auto">ห้องเรียนพิเศษวิทยาศาสตร์ คณิตศาสตร์ และเทคโนโลยี/อังกฤษ ปีการศึกษา 2569</p>
                    </header>

                    {/* Main Content */}
                    <main className="flex-grow">
                        {loading && view === 'home' ? (
                            <div className="flex flex-col justify-center items-center h-48 gap-3">
                                <div className="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-blue-500"></div>
                                <p className="text-gray-500 text-sm">กำลังโหลดข้อมูลห้องพัก...</p>
                            </div>
                        ) : (
                            view === 'home' ? renderHome() : <RegistrationForm />
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="mt-auto py-6 text-center text-sm text-gray-500 glass-panel mt-12 border-t border-gray-200">
                        <p>© ROOM REGIS SMT 2026 ALLRIGHT RESERVED</p>
                        <p className="mt-1">
                            <a href="https://www.instagram.com/big_chissanucha_pk?igsh=MWNvZGJydTk1cGJh" target="_blank" rel="noopener noreferrer" className="text-blue-500 hover:text-blue-700 font-medium transition-colors">
                                Dev_Chissanucha Fadsura
                            </a>
                        </p>
                    </footer>

                    {/* Alert Modal */}
                    {modalMsg && (
                        <div className="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl">
                                <h3 className="text-lg font-bold text-gray-900 mb-2">แจ้งเตือน</h3>
                                <p className="text-gray-600 mb-6 whitespace-pre-line">{modalMsg}</p>
                                <div className="flex justify-end">
                                    <button onClick={closeAlert} className="bg-blue-600 text-white px-5 py-2 rounded-xl hover:bg-blue-700 transition-colors">ตกลง</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Delete Confirm Modal */}
                    {deleteData && (
                        <div className="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl">
                                <h3 className="text-xl font-bold text-red-600 mb-2">ยืนยันการยกเลิกห้องพัก</h3>
                                <p className="text-gray-600 mb-4">
                                    ท่านต้องการลบข้อมูลของ <b>{getVal(deleteData, ['ชื่อ - สกุล', 'ชื่อ-สกุล', 'fullname'])}</b> ออกจาก <b>{getVal(deleteData, ['ชื่อห้องพัก', 'room_name'])}</b> หรือไม่?
                                </p>
                                <div className="mb-6">
                                    <label className="block text-sm font-medium text-gray-700 mb-1">เพื่อยืนยัน กรุณากรอกเลขบัตรประจำตัวประชาชน</label>
                                    <input 
                                        type="password" 
                                        className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-red-400 outline-none"
                                        value={idCardInput}
                                        onChange={(e) => setIdCardInput(e.target.value)}
                                        placeholder="เลขบัตรประจำตัวประชาชน..."
                                    />
                                </div>
                                <div className="flex justify-end gap-3">
                                    <button onClick={() => setDeleteData(null)} className="px-5 py-2 rounded-xl text-gray-600 bg-gray-100 hover:bg-gray-200 transition-colors">ยกเลิก</button>
                                    <button onClick={executeDelete} disabled={loading} className={`px-5 py-2 rounded-xl text-white transition-colors ${loading ? 'bg-red-400' : 'bg-red-600 hover:bg-red-700'}`}>
                                        {loading ? 'กำลังตรวจสอบ...' : 'ยืนยันการลบ'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
